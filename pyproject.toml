[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jiralens"
version = "0.1.0"
description = "A read-only Jira Cloud project health auditor."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kay Kalunga Kabwe" }]
keywords = ["jira", "jira-cloud", "atlassian", "audit", "governance", "project-health"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "streamlit>=1.37",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kalungakkabwe/jiralens"
Issues = "https://github.com/kalungakkabwe/jiralens/issues"

[project.scripts]
jiralens = "jiralens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jiralens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=jiralens --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:jiralens.*"]

[tool.coverage.run]
branch = true
source = ["jiralens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S311"]  # non-crypto randomness is fine for synthetic fixtures
# Fake credentials are the point of these tests: they prove a token cannot leak.
"tests/*" = ["S105", "S106"]

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install JiraLens
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run linting
        run: ruff check .

      - name: Run tests
        run: pytest --cov=jiralens --cov-report=term-missing

      - name: Confirm demo mode needs no credentials
        env:
          JIRA_BASE_URL: ""
          JIRA_EMAIL: ""
          JIRA_API_TOKEN: ""
        run: jiralens demo

      - name: Confirm demo mode writes all three reports
        run: jiralens demo --output "$RUNNER_TEMP/reports"

      - name: Confirm the fixtures are reproducible
        run: |
          python scripts/generate_demo_data.py
          git diff --exit-code -- src/jiralens/data/

      - name: Confirm the sample reports are reproducible
        run: |
          python scripts/generate_sample_reports.py
          git diff --exit-code -- sample_reports/
